name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Required, not cosmetic: the publish below authenticates to npm via OIDC trusted
      # publishing (no NODE_AUTH_TOKEN anywhere in this workflow), and OIDC needs npm >= 11.5.1,
      # while Node ships npm 10.x. Without this step npm falls back to the placeholder token
      # setup-node writes into .npmrc and the registry answers 404 on PUT. Keep Node new enough
      # for the current npm@latest: npm 12 requires ^22.22.2 || ^24.15.0 || >=26.
      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Update package version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$CURRENT_VERSION" ]; then
            npm version $TAG_VERSION --no-git-tag-version
          else
            echo "Version already matches tag version $TAG_VERSION, skipping npm version"
          fi

      - name: Publish to NPM
        run: npm publish --provenance --access public